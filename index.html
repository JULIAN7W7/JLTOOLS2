<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JLTOOLS2</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background"></div>
    
    <header class="glass-header">
        <div class="header-content">
            <div class="header-left">
                <h1 class="logo">JLTOOLS2</h1>
                <div class="nav-buttons">
                    <button class="glass-btn" onclick="openAddModal()">
                        <span class="icon">➕</span>
                        Subir App
                    </button>
                    <button class="glass-btn" onclick="openEditSelectModal()">
                        <span class="icon">✏️</span>
                    </button>
                    <button class="glass-btn" onclick="toggleSelectMode()">
                        <span class="icon">☑️</span>
                    </button>
                    <button class="glass-btn hidden" id="deleteSelectedBtn" onclick="deleteSelectedApps()">
                        <span class="icon">🗑️</span>
                    </button>
                </div>
            </div>
            <div class="header-controls">
                <div class="clock" id="clock">00:00:00</div>
                <button class="glass-btn theme-toggle" onclick="toggleTheme()" aria-label="Cambiar tema">
                    <span class="icon">🌙</span>
                </button>
            </div>
        </div>
    </header>

    <main class="main-content">

        <div class="apps-grid" id="appsGrid">
            <!-- Las cards se generarán dinámicamente -->
        </div>
    </main>

    <!-- Modal para subir/editar app -->
    <div class="modal" id="appModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Subir App</h2>
                <button class="close-btn" id="closeModal">✕</button>
            </div>
            <form id="appForm">
                <input type="hidden" id="appId">
                <div class="form-group">
                    <label for="appName">Nombre de la App</label>
                    <input type="text" id="appName" required placeholder="Ej: Mi App">
                </div>
                <div class="form-group">
                    <label for="appDescription">Descripción</label>
                    <textarea id="appDescription" required placeholder="Descripción de la app..."></textarea>
                </div>
                <div class="form-group">
                    <label for="appImage">Subir Imagen</label>
                    <input type="file" id="appImage" accept="image/*">
                    <div class="image-preview" id="imagePreview"></div>
                </div>
                <div class="form-group">
                    <label for="appLink">Link de Descarga</label>
                    <input type="url" id="appLink" required placeholder="https://...">
                </div>
                <div class="form-actions">
                    <button type="submit" class="glass-btn">Guardar</button>
                    <button type="button" class="glass-btn" id="cancelBtn">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal para seleccionar app a editar -->
    <div class="modal" id="editSelectModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Seleccionar App para Editar</h2>
                <button class="close-btn" id="closeEditModal">✕</button>
            </div>
            <div class="apps-list" id="editAppsList">
                <!-- Lista de apps para editar -->
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
